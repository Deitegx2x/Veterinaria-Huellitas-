<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Mascotas')}"></head>
<body>
    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2>
                    <i class="bi bi-heart-pulse-fill text-danger"></i> Mascotas
                </h2>
                <p class="text-muted">Control de pacientes veterinarios</p>
            </div>
            <a th:href="@{/mascota/new}" class="btn btn-primary btn-lg">
                <i class="bi bi-plus-circle-fill"></i> Nueva Mascota
            </a>
        </div>

        <div class="card shadow">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Paciente</th>
                                <th>Raza</th>
                                <th>Especie</th>
                                <th>Nacimiento</th>
                                <th>Género</th>
                                <th>Dueño</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="mascota : ${mascotas}">
                                <td th:text="${mascota.idMascota}"></td>
                                <td>
                                    <div class="d-flex align-items-center">
                                        <div class="pet-icon me-2">
                                            <i th:if="${mascota.especie == 'Perro'}" class="bi bi-emoji-smile-fill"></i>
                                            <i th:if="${mascota.especie != 'Perro'}" class="bi bi-heart-fill"></i>
                                        </div>
                                        <span th:text="${mascota.nombre}"></span>
                                    </div>
                                </td>
                                <td th:text="${mascota.raza}"></td>
                                <td>
                                    <span class="badge bg-info" th:text="${mascota.especie}"></span>
                                </td>
                                <td th:text="${mascota.fecha_nacimiento}"></td>
                                <td>
                                    <span class="badge bg-success" th:text="${mascota.genero}"></span>
                                </td>
                                <td>
                                    <i class="bi bi-person-fill text-primary"></i>
                                    <span th:text="${mascota.cliente != null ? (mascota.cliente.nombre + ' ' + mascota.cliente.apellido) : 'Sin dueño'}"></span>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{/mascota/edit/{id}(id=${mascota.idMascota})}" class="btn btn-warning btn-sm">
                                        <i class="bi bi-pencil-fill"></i>
                                    </a>
                                    <a th:href="@{/mascota/delete/{id}(id=${mascota.idMascota})}" class="btn btn-danger btn-sm" onclick="return confirm('¿Desea eliminar esta mascota?')">
                                        <i class="bi bi-trash-fill"></i>
                                    </a>
                                </td>
                            </tr>
                            <tr th:if="${mascotas == null || #lists.isEmpty(mascotas)}">
                                <td colspan="8" class="text-center text-muted">
                                    <i class="bi bi-info-circle"></i> No hay mascotas registradas
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
