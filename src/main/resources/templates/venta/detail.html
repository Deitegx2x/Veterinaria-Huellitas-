<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Detalle de Venta')}">
    <title>Spring Boot</title>
</head>

<body class="bg-light">

    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container mt-4">
        <div class="row mb-3">
            <div class="col-md-12">
                <h2 class="fw-bold">
                    <i class="bi bi-receipt-cutoff text-primary"></i>
                    Detalle de Venta
                </h2>
            </div>
        </div>

        <div class="card shadow-sm mb-4" th:if="${not #lists.isEmpty(listDetalleVenta)}">
            <div class="card-body bg-white">
                <div class="row text-center text-md-start">
                    <div class="col-md-3 mb-2 mb-md-0">
                        <span class="text-muted d-block">Nro. Comprobante</span>
                        <strong class="fs-5 text-dark" th:text="${'#VTA-' + listDetalleVenta[0].id.venta.nroventa}"></strong>
                    </div>
                    <div class="col-md-3 mb-2 mb-md-0">
                        <span class="text-muted d-block">Cliente</span>
                        <strong class="text-dark" th:text="${listDetalleVenta[0].id.venta.cliente.nombre + ' ' + listDetalleVenta[0].id.venta.cliente.apellido}"></strong>
                    </div>
					<div class="col-md-3 mb-2 mb-md-0">
					    <span class="text-muted d-block">Mascota</span>
					    <strong class="text-dark" th:text="${listDetalleVenta[0].id.venta.mascota.nombre}"></strong>
					</div>
                    <div class="col-md-3 mb-2 mb-md-0">
                        <span class="text-muted d-block">Atendido por</span>
                        <strong class="text-dark" th:text="${listDetalleVenta[0].id.venta.cajeraVenta.nombres}"></strong>
                    </div>
                    <div class="col-md-3">
                        <span class="text-muted d-block">Fecha de Emisión</span>
                        <strong class="text-dark" th:text="${#dates.format(listDetalleVenta[0].id.venta.fechaVenta, 'dd/MM/yyyy HH:mm')}"></strong>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <i class="bi bi-list-check"></i>
                Productos Vendidos
            </div>
            <div class="card-body">
                <table class="table table-striped table-bordered table-hover align-middle">
                    <thead class="table-dark text-center">
                        <tr>
                            <th width="120">Nro Venta</th>
                            <th>Código</th>
                            <th>Producto / Descripción</th>
                            <th width="140">Precio Venta</th>
                            <th width="100">Cantidad</th>
                            <th width="140">Importe</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${listDetalleVenta}">
                            <td class="text-center fw-bold" th:text="${item.id.venta.nroventa}"></td>
                            <td class="text-center" th:text="${item.id.producto.codigo}"></td>
                            <td th:text="${item.id.producto.descripcion}"></td>
                            <td class="text-end" th:text="${'S/ ' + #numbers.formatDecimal(item.precioVta, 1, 'POINT', 2, 'COMMA')}"></td>
                            <td class="text-center" th:text="${#numbers.formatDecimal(item.cantidadVta, 1, 0)}"></td>
                            <td class="text-end fw-bold text-success" th:text="${'S/ ' + #numbers.formatDecimal(item.importeVta, 1, 'POINT', 2, 'COMMA')}"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(listDetalleVenta)}">
                            <td colspan="6" class="text-center text-muted p-4">
                                <i class="bi bi-exclamation-circle fs-4 d-block mb-2"></i>
                                No existen detalles para mostrar para esta venta.
                            </td>
                        </tr>
                    </tbody>
                </table>
                
                <div class="d-flex justify-content-end mt-3" th:if="${not #lists.isEmpty(listDetalleVenta)}">
                    <div class="bg-light p-3 rounded border text-end" style="min-width: 250px;">
                        <span class="text-muted small">TOTAL COMPRA (Inc. IGV):</span>
                        <h3 class="text-success fw-bold mb-0" th:text="${'S/ ' + #numbers.formatDecimal(listDetalleVenta[0].id.venta.total, 1, 'POINT', 2, 'COMMA')}"></h3>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="mt-3 mb-5">
            <a th:href="@{/venta}" class="btn btn-secondary">
                <i class="bi bi-arrow-left-circle"></i>
                Volver al Listado
            </a>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
