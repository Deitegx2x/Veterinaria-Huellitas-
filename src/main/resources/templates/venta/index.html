<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Lista de Ventas')}">
    <title>Spring Boot</title>
</head>

<body class="bg-light">

    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container mt-3">
        <div class="row mb-3">
            <div class="col-md-6">
                <h1>
                    <i class="bi bi-cart-check-fill text-success"></i>
                    Lista de Ventas
                </h1>
            </div>
            <div class="col-md-6 text-end">
                <a th:href="@{/venta/new}" class="btn btn-success">
                    <i class="bi bi-cart-plus"></i>
                    Nueva Venta
                </a>
            </div>
        </div>
        
        <div class="card shadow-sm">
            <div class="card-body">

                <table class="table table-striped table-bordered table-hover align-middle">
                    <thead class="table-dark text-center">
                        <tr>
                            <th>N° Venta</th>
                            <th>Fecha</th>
                            <th>Cliente</th>
							<th>Mascota</th>
                            <th>Cajera</th>
                            <th>Subtotal</th>
                            <th>IGV</th>
                            <th>Total</th>
                            <th width="100">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${ventas}">
                            <td class="text-center" th:text="${item.nroventa}"></td>
                            
                            <td th:text="${item.fechaVenta != null ? #dates.format(item.fechaVenta, 'dd/MM/yyyy HH:mm') : 'Sin fecha'}"></td>
                            
                            <td th:text="${item.cliente != null ? (item.cliente.nombre + ' ' + item.cliente.apellido) : 'Sin Cliente'}"></td>
							
							<td th:text="${item.mascota != null ? item.mascota.nombre : 'Sin Mascota'}"></td>
                            
                            <td th:text="${item.cajeraVenta != null ? item.cajeraVenta.nombres : 'Sin Cajera'}"></td>
                            
                            <td th:text="${'S/ ' + item.subtotal}"></td>
                            <td th:text="${'S/ ' + item.igv}"></td>
                            <td th:text="${'S/ ' + item.total}"></td>
                            
                            <td class="text-center">
                                <a th:href="@{/venta/verDetalle/{id}(id=${item.nroventa})}"
                                   class="btn btn-primary btn-sm"
                                   title="Ver Detalle">
                                    <i class="bi bi-search"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(ventas)}">
                            <td colspan="8" class="text-center text-muted">No hay registros de ventas disponibles.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <div th:replace="~{fragments/scripts :: scripts}"></div>
</body>
</html>
