<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">


<head th:replace="~{fragments/head :: head('Nuevo Producto')}">
</head>



<body>



<div th:replace="~{fragments/header :: header}"></div>





<div class="container">






<div class="row justify-content-center">



<div class="col-lg-7">





<div class="card shadow">






<div class="card-header text-center">


<h3>

<i class="bi bi-capsule-pill"></i>

Registrar Producto


</h3>


<p class="mb-0">

Nuevo artículo veterinario


</p>


</div>







<div class="card-body p-4">





<form th:action="@{/producto}"

      th:object="${producto}"

      method="POST">







<div class="mb-3">


<label>

<i class="bi bi-upc-scan"></i>

Código


</label>



<input type="text"

       th:field="*{codigo}"

       class="form-control"

       readonly>


</div>








<div class="mb-3">


<label>

<i class="bi bi-box-seam-fill"></i>

Descripción


</label>



<input type="text"

       th:field="*{descripcion}"

       class="form-control"

       placeholder="Ej: Shampoo medicado">


</div>









<div class="row">






<div class="col-md-6 mb-3">



<label>

<i class="bi bi-cart-plus"></i>

Precio compra


</label>



<input type="number"

       step="0.01"

       th:field="*{precioCompra}"

       class="form-control">



</div>








<div class="col-md-6 mb-3">



<label>

<i class="bi bi-cash-stack"></i>

Precio venta


</label>



<input type="number"

       step="0.01"

       th:field="*{precioVenta}"

       class="form-control">



</div>






</div>









<div class="row">






<div class="col-md-6 mb-3">



<label>

<i class="bi bi-boxes"></i>

Stock


</label>



<input type="number"

       th:field="*{stock}"

       class="form-control">



</div>









<div class="col-md-6 mb-3">



<label>

<i class="bi bi-tags-fill"></i>

Categoría


</label>





<select class="form-select"

        th:field="*{categoria.id}">





<option value="">

Seleccione categoría

</option>





<option th:each="categoria : ${categoriaList}"

        th:value="${categoria.id}"

        th:text="${categoria.descripcion}">


</option>





</select>





</div>






</div>









<div class="row g-3 mt-2">





<div class="col-md-6">



<button type="submit"

        class="btn btn-primary w-100">



<i class="bi bi-save-fill"></i>

Guardar Producto



</button>



</div>








<div class="col-md-6">



<a th:href="@{/producto}"

class="btn btn-outline-secondary w-100">



<i class="bi bi-arrow-left-circle"></i>

Volver



</a>



</div>







</div>







</form>






</div>


</div>





</div>


</div>





</div>








<div th:replace="~{fragments/footer :: footer}"></div>


<div th:replace="~{fragments/scripts :: scripts}"></div>





</body>


</html>
