<<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Login')}">
    <meta charset="ISO-8859-1">
    <title>Usuarios - Sistema de Ventas</title>
</head>

<body class="bg-light">

    <!-- HEADER -->
    <div th:replace="~{fragments/header :: header}"></div>

    <!-- CONTENIDO -->
    <div class="container mt-4">
        <div class="row mb-3">
            <div class="col-md-12">
                <h2 class="fw-bold">
                    <i class="bi bi-people-fill text-primary"></i>
                    Lista de Usuarios
                </h2>
            </div>
        </div>
    </div>
	
	<div class="card shadow-sm">
		<div class="card-body">
			<table class="table table-striped table-hover table-bordered">
				<thead class="table-dark">
					<tr>
						<th>Id</th>
						<th>Nombres</th>
						<th>Apellidos</th>
						<th>Usuarios</th>
						<th>Clave</th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="item: ${usuarios}">
						<td th:text="${item.id}"></td>
						<td th:text="${item.nombres}"></td>
						<td th:text="${item.apellidos}"></td>
						<td th:text="${item.username}"></td>
						<td th:text="${item.clave}"></td>
					</tr>
				</tbody>
			</table>
		</div>
	</div>

	<div th:replace="~{fragments/footer :: footer}"></div>

	<script th:replace="~{fragments/scripts :: scripts}"></script>
</body>
</html>
